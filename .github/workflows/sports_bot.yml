name: Hyunduk Sports Scheduled Telegram Bot

on:
  schedule:
    - cron: '2 16 * * 1-5'
    - cron: '2 22 * * *'
    - cron: '2 8 * * 1-5'
    - cron: '2 4 * * 0,6'
    - cron: '2 11 * * 0,6'
    - cron: '30 23 * * *'
    - cron: '30 6 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Korean fonts
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-nanum
          pip install requests google-genai matplotlib

      - name: Run Scheduled Sports Analyzer & Send to Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SPORTSGAMEODDS_KEY: ${{ secrets.SPORTSGAMEODDS_KEY }}
          STATSHAWK_KEY: ${{ secrets.STATSHAWK_KEY }}
        run: python send_analysis.py

      - name: Save picks history
        run: |
          git config user.name "sports-bot"
          git config user.email "sports-bot@users.noreply.github.com"
          git add picks_history.json
          git diff --staged --quiet || (git commit -m "Update picks history" && git push)
