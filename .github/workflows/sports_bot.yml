name: Hyunduk Sports Scheduled Telegram Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-bot-run
  cancel-in-progress: false

jobs:
  send_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests google-genai

      - name: Run 1-Hour-Before-Kickoff Sports Analyzer & Grader
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SPORTSGAMEODDS_KEY: ${{ secrets.SPORTSGAMEODDS_KEY }}
          STATSHAWK_KEY: ${{ secrets.STATSHAWK_KEY }}
        run: python send_analysis.py

      - name: Save picks history
        run: |
          git config user.name "sports-bot"
          git config user.email "sports-bot@users.noreply.github.com"
          git add picks_history.json
          if ! git diff --staged --quiet; then
            git commit -m "Update picks history"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main || true
              git push && break
              sleep 3
            done
          fi
