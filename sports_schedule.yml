name: Hyunduk Sports Scheduled Telegram Bot

on:
  # 수동 테스트 실행 버튼 활성화
  workflow_dispatch:
    inputs:
      slot:
        description: '실행할 분석 타임슬롯 선택 (07_nba_nhl / 17_domestic / 13_weekend_domestic / 01_overseas_soccer / 20_weekend_soccer)'
        required: true
        default: '07_nba_nhl'

  # 한국시간(KST = UTC+9) 기준 자동 실행 스케줄
  schedule:
    # 1. 매일 아침 07:00 KST (22:00 UTC) - NBA · NHL 고퀄리티 예약분석
    - cron: '0 22 * * *'
    # 2. 평일(월~금) 낮 17:00 KST (08:00 UTC, 월~금) - 국내경기 + 아시아축구(J리그/K리그/ACL)
    - cron: '0 8 * * 1-5'
    # 3. 평일(월~금) 새벽 01:00 KST (16:00 UTC, 일~목) - 해외축구 (~05:50 KST 경기)
    - cron: '0 16 * * 0-4'
    # 4. 주말(토·일) 낮 13:00 KST (04:00 UTC, 토·일) - 주말 국내경기 + 아시아축구
    - cron: '0 4 * * 6,0'
    # 5. 주말(토·일) 밤 20:00 KST (11:00 UTC, 토·일) - 주말 해외축구리그 통합 (~익일 05:30 KST)
    - cron: '0 11 * * 6,0'

jobs:
  send_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests google-genai pytz

      - name: Run Scheduled Sports Analyzer & Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '9112315353' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MANUAL_SLOT: ${{ github.event.inputs.slot }}
        run: |
          python send_analysis.py
